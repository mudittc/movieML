
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieMatch | Discover Films</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <header>
        <div class="logo">🎬 MOVIEMATCH</div>
        <div class="tagline">A WORLD OF FILMS, ONE DISCOVERY AWAY.</div>
    </header>

    <main>
        <section class="hero">
            <p class="eyebrow">YOUR PERSONAL FILM DISCOVERY ENGINE</p>

            <h1>Find your next<br>
                <span>obsession.</span>
            </h1>

            <p class="description">
                Tell us what you love watching.
                We'll find something you'll love next.
            </p>

            
            <div class="search-container">

                <div class="search-box">
                    <input
                        type="text"
                        id="movie-search"
                        placeholder="Search for a movie..."
                        autocomplete="off"
                    >

                    <div id="search-results"></div>
                </div>

                <button id="recommend-button">
                    FIND SIMILAR MOVIES
                </button>

            </div>

            <p id="selected-movie"></p>

        </section>

        <section id="results-section">
            <h2>Your next watch</h2>
            <div id="recommendations" class="movie-grid"></div>
            <p id="recommendation-status"></p>
        </section>
    </main>

    <!-- MOVIE DETAILS MODAL -->
    <div id="movie-modal" class="movie-modal">

        <div class="movie-modal-content">

            <button id="close-modal" class="close-modal">&times;</button>

            <div class="movie-modal-header">
                <div>
                    <p class="eyebrow">MOVIEMATCH PRESENTS</p>
                    <h2 id="modal-title"></h2>
                    <p id="modal-meta"></p>
                </div>
            </div>

            <div class="movie-modal-body">

                <p id="modal-rating" class="modal-rating"></p>

                <h3>Overview</h3>
                <p id="modal-overview"></p>

                <h3>Genres</h3>
                <div id="modal-genres" class="modal-tags"></div>

                <h3>Director</h3>
                <p id="modal-director"></p>

                <h3>Cast</h3>
                <div id="modal-cast" class="modal-tags"></div>

                <h3>Collection</h3>
                <p id="modal-collection"></p>

                <a id="modal-imdb" href="#" target="_blank" rel="noopener noreferrer">
                    View on IMDb ↗
                </a>

            </div>

        </div>

    </div>

    <script src="/static/script.js"></script>

</body>
</html>
